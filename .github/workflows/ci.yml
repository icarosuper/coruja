name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run cf-typegen
      - run: bun run verify
      - run: bun run build

  pr-title:
    # Squash merge turns the PR title into the commit subject on master.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|docs|test|chore): [a-z].{1,70}[^.]$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'feat: add holiday overrides' (types: feat, fix, refactor, docs, test, chore; lowercase after the colon; no trailing period; up to ~72 chars). Got: $TITLE"
            exit 1
          fi
